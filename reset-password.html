<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/lang-detect.js"></script>
    <title>Valuon — Reset Password</title>
    <meta name="description" content="Set a new password for your Valuon account.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/toast.css">
    <script>
        (function () { const t = localStorage.getItem('valuon-theme'); if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); if (window.getValuonLang) document.documentElement.lang = window.getValuonLang(); })();
    </script>
    <meta name="theme-color" content="#2563eb">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Valuon">
</head>

<body class="auth-body">
    <a href="login.html" class="back-link" data-i18n="back_to_login" data-animate="fade">← Back to Login</a>
    <div class="auth-top-actions" data-animate="fade">
        <button type="button" id="theme-toggle" class="icon-btn" title="Toggle Theme"
            aria-label="Toggle theme / Переключить тему"><i class="fa-solid fa-moon"></i></button>
        <button type="button" id="lang-toggle" class="icon-btn" title="Switch Language"
            aria-label="Switch language / Переключить язык">EN</button>
    </div>

    <div class="auth-container">
        <div class="auth-card" data-animate-group data-animate-step="70">
            <div id="reset-checking" class="reset-checking" style="text-align:center;padding:32px 0;">
                <i class="fa-solid fa-circle-notch fa-spin" style="font-size:1.75rem;color:var(--primary);margin-bottom:12px;"></i>
                <p class="forgot-desc" style="margin:0;">...</p>
            </div>

            <div id="reset-header" class="hidden" data-animate>
                <div class="auth-logo auth-logo--unlock">
                    <svg width="48" height="48" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <g class="lock-shackle">
                            <path d="M14 18V12a6 6 0 0 1 12 0v6" stroke="#2563eb" stroke-width="3"
                                stroke-linecap="round" stroke-linejoin="round" />
                        </g>
                        <rect x="10" y="17" width="20" height="16" rx="3" fill="#3b82f6" stroke="#2563eb"
                            stroke-width="1.5" />
                        <circle cx="20" cy="25" r="2.5" fill="white" />
                        <path d="M20 27.5v4" stroke="white" stroke-width="2" stroke-linecap="round" />
                    </svg>
                    <h1 data-i18n="reset_title">New Password</h1>
                </div>
                <p class="auth-subtitle" data-i18n="reset_subtitle">Create a strong password for your account</p>
            </div>

            <form id="reset-form" class="auth-form hidden" action="#" novalidate>
                <div class="input-group" data-animate>
                    <label for="new-password" data-i18n="label_new_password">New Password</label>
                    <div class="input-wrap">
                        <span class="input-icon"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" id="new-password" required placeholder="••••••••"
                            autocomplete="new-password">
                        <button type="button" class="toggle-password" aria-label="Toggle visibility">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="input-group" data-animate>
                    <label for="confirm-password" data-i18n="label_confirm_password">Confirm Password</label>
                    <div class="input-wrap">
                        <span class="input-icon"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" id="confirm-password" required placeholder="••••••••"
                            autocomplete="new-password">
                        <button type="button" class="toggle-password-confirm" aria-label="Toggle visibility">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary auth-btn" data-i18n="btn_reset_password"
                    data-animate>Change Password</button>
            </form>

            <div id="reset-success" class="hidden" style="text-align: center;">
                <div class="forgot-icon success">
                    <i class="fa-solid fa-check"></i>
                </div>
                <h3 data-i18n="reset_success_title">Password Changed!</h3>
                <p class="forgot-desc" data-i18n="reset_success_desc">You can now sign in with your new password.</p>
                <a href="login.html" class="btn btn-primary auth-btn" data-i18n="btn_go_login">Go to Login</a>
            </div>

            <div id="reset-error" class="hidden" style="text-align: center;">
                <div class="forgot-icon" style="background: rgba(239,68,68,0.1); color: #ef4444;">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>
                <h3>Ссылка недействительна</h3>
                <p class="forgot-desc">Срок действия ссылки истёк или она уже была
                    использована. Запросите новую ссылку.</p>
                <button type="button" id="request-new-link-btn" class="btn btn-outline auth-btn"
                    data-i18n="btn_request_new">Request New</button>
            </div>
        </div>
    </div>

    <script src="js/login-lang.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/theme.js"></script>
    <script>
        (function () {
            var items = document.querySelectorAll('[data-animate]');
            var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (reduceMotion) {
                items.forEach(function (el) { el.classList.add('is-visible'); });
                return;
            }
            items.forEach(function (el) {
                var delay = 0;
                var group = el.closest('[data-animate-group]');
                if (group) {
                    var step = parseInt(group.dataset.animateStep, 10) || 80;
                    var siblings = Array.prototype.slice.call(group.querySelectorAll('[data-animate]'));
                    var index = siblings.indexOf(el);
                    if (index >= 0) delay = index * step;
                }
                setTimeout(function () { el.classList.add('is-visible'); }, delay);
            });
        })();
    </script>
    <script type="module">
        import { supabase, setSessionOnly } from './js/supabase-client.js';
        import { initPasswordStrength, checkPasswordStrength, initPasswordMatch } from './js/password-strength.js';

        setSessionOnly(true);

        document.querySelector('.back-link')?.addEventListener('click', async (e) => {
            e.preventDefault();
            const href = e.currentTarget.getAttribute('href') || 'login.html';
            try { await supabase.auth.signOut(); } catch (_) { /* ignore */ }
            window.location.href = href;
        });

        const resetChecking = document.getElementById('reset-checking');
        const resetForm = document.getElementById('reset-form');
        const resetHeader = document.getElementById('reset-header');
        const successBlock = document.getElementById('reset-success');
        const errorBlock = document.getElementById('reset-error');

        const ERROR_TEXTS = {
            ru: {
                checking: 'Проверяем ссылку...',
                expired_title: 'Срок ссылки истёк',
                expired_desc: 'Время действия ссылки для сброса пароля истекло. Запросите новую.',
                used_title: 'Ссылка уже использована',
                used_desc: 'Эта ссылка для сброса пароля уже была использована. Запросите новую.',
                invalid_title: 'Некорректная ссылка',
                invalid_desc: 'Ссылка для сброса пароля повреждена или некорректна. Запросите новую.',
                network_title: 'Ошибка соединения',
                network_desc: 'Не удалось связаться с сервером. Проверьте подключение к интернету и попробуйте снова.',
                default_title: 'Ссылка недействительна',
                default_desc: 'Срок действия ссылки истёк или она уже была использована. Запросите новую ссылку.',
                submit_same_password: 'Новый пароль должен отличаться от старого.',
                submit_expired: 'Срок действия сессии истёк. Обновите страницу и запросите новую ссылку.',
                submit_network: 'Ошибка сети. Проверьте подключение и попробуйте снова.',
                submit_unknown: 'Ошибка смены пароля. Попробуйте снова или запросите новую ссылку.',
            },
            en: {
                checking: 'Verifying link...',
                expired_title: 'Link Expired',
                expired_desc: 'The password reset link has expired. Please request a new one.',
                used_title: 'Link Already Used',
                used_desc: 'This password reset link has already been used. Please request a new one.',
                invalid_title: 'Invalid Link',
                invalid_desc: 'This password reset link is malformed or invalid. Please request a new one.',
                network_title: 'Connection Error',
                network_desc: 'Could not reach the server. Check your internet connection and try again.',
                default_title: 'Invalid Link',
                default_desc: 'The link has expired or has already been used. Please request a new one.',
                submit_same_password: 'New password must be different from your previous password.',
                submit_expired: 'Session expired. Reload the page and request a new link.',
                submit_network: 'Network error. Check your connection and try again.',
                submit_unknown: 'Failed to reset password. Try again or request a new link.',
            },
        };

        function classifyResetError(error) {
            if (!navigator.onLine) return 'network';
            const code = String(error?.code || '').toLowerCase();
            const msg = String(error?.message || error?.description || '').toLowerCase();
            if (code === 'same_password' || msg.includes('different from the old password') || msg.includes('same password')) return 'same_password';
            if (code.includes('otp_expired') || msg.includes('expired')) return 'expired';
            if (code.includes('otp_already_used') || msg.includes('already used') || msg.includes('already been used')) return 'used';
            if (code.includes('invalid_credentials') || msg.includes('invalid') || msg.includes('bad code')) return 'invalid';
            if (msg.includes('network') || msg.includes('fetch')) return 'network';
            return 'unknown';
        }

        function getLang() {
            return (window.getValuonLang ? window.getValuonLang() : 'en');
        }

        const checkingLabel = resetChecking?.querySelector('.forgot-desc');
        if (checkingLabel) {
            const initT = ERROR_TEXTS[getLang()] || ERROR_TEXTS.ru;
            checkingLabel.textContent = initT.checking;
        }

        function showResetForm() {
            resetChecking?.classList.add('hidden');
            resetHeader?.classList.remove('hidden');
            resetForm?.classList.remove('hidden');
            initPasswordStrength('new-password', { getLang });
            initPasswordMatch('new-password', 'confirm-password', { getLang });
        }

        function showErrorBlock(type) {
            const lang = getLang();
            const t = ERROR_TEXTS[lang] || ERROR_TEXTS.ru;
            const key = ERROR_TEXTS.ru[type + '_title'] ? type : 'default';
            const titleEl = errorBlock.querySelector('h3');
            const descEl = errorBlock.querySelector('.forgot-desc');
            if (titleEl) titleEl.textContent = t[key + '_title'] || t.default_title;
            if (descEl) descEl.textContent = t[key + '_desc'] || t.default_desc;
            resetChecking?.classList.add('hidden');
            resetForm?.classList.add('hidden');
            resetHeader?.classList.add('hidden');
            errorBlock?.classList.remove('hidden');
        }

        const searchParams = new URLSearchParams(window.location.search);
        const authCode = searchParams.get('code');
        const tokenHash = searchParams.get('token_hash');

        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        const accessToken = hashParams.get('access_token');
        const recoveryType = hashParams.get('type') || searchParams.get('type');
        const urlError = hashParams.get('error_code') || searchParams.get('error_code')
            || hashParams.get('error') || searchParams.get('error')
            || hashParams.get('error_description') || searchParams.get('error_description');

        const clearResetUrl = () => {
            try {
                window.history.replaceState(null, '', window.location.pathname);
            } catch (_) { /* ignore */ }
        };

        if (urlError) {
            showErrorBlock(classifyResetError({ message: urlError, code: urlError }));
            clearResetUrl();
        } else if (authCode) {
            try {
                const { data: existing } = await supabase.auth.getSession();
                if (!existing?.session) {
                    const { error: exchangeError } = await supabase.auth.exchangeCodeForSession(authCode);
                    if (exchangeError) throw exchangeError;
                }
                showResetForm();
            } catch (e) {
                console.error('PKCE exchange error:', e);
                showErrorBlock(classifyResetError(e));
            } finally {
                clearResetUrl();
            }
        } else if (tokenHash && (!recoveryType || recoveryType === 'recovery')) {
            try {
                const { error: otpError } = await supabase.auth.verifyOtp({
                    token_hash: tokenHash,
                    type: 'recovery'
                });
                if (otpError) throw otpError;
                showResetForm();
            } catch (e) {
                console.error('OTP verify error:', e);
                showErrorBlock(classifyResetError(e));
            } finally {
                clearResetUrl();
            }
        } else if (accessToken && recoveryType === 'recovery') {
            try {
                const { error: sessionError } = await supabase.auth.setSession({
                    access_token: accessToken,
                    refresh_token: hashParams.get('refresh_token') || ''
                });
                if (sessionError) throw sessionError;
                showResetForm();
            } catch (e) {
                console.error('Session error:', e);
                showErrorBlock(classifyResetError(e));
            } finally {
                clearResetUrl();
            }
        } else {
            const { data: existing } = await supabase.auth.getSession().catch(() => ({ data: null }));
            if (existing?.session) {
                showResetForm();
            } else {
                showErrorBlock('invalid');
            }
        }

        document.querySelectorAll('.toggle-password, .toggle-password-confirm').forEach(btn => {
            btn.addEventListener('click', () => {
                const input = btn.parentElement.querySelector('input');
                const icon = btn.querySelector('i');
                const isPassword = input.type === 'password';
                input.type = isPassword ? 'text' : 'password';
                icon.className = isPassword ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
                icon.classList.add('anim-pop');
                setTimeout(() => icon.classList.remove('anim-pop'), 300);
            });
        });

        if (resetForm) {
            resetForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                const newPass = document.getElementById('new-password').value;
                const confirmPass = document.getElementById('confirm-password').value;
                const btn = resetForm.querySelector('button[type="submit"]');
                const originalText = btn.innerHTML;
                const lang = getLang();

                if (!newPass) {
                    showToast(lang === 'ru' ? 'Введите новый пароль' : 'Enter a new password', 'warning');
                    document.getElementById('new-password')?.focus();
                    return;
                }

                if (!confirmPass) {
                    showToast(lang === 'ru' ? 'Подтвердите новый пароль' : 'Confirm your new password', 'warning');
                    document.getElementById('confirm-password')?.focus();
                    return;
                }

                if (newPass !== confirmPass) {
                    showToast(lang === 'ru' ? 'Пароли не совпадают' : 'Passwords do not match', 'error');
                    return;
                }

                const strength = checkPasswordStrength(newPass);
                if (!strength.isValid) {
                    showToast(lang === 'ru' ? 'Пароль слишком слабый. Используйте минимум 8 символов, буквы и цифры.' : 'Password is too weak. Use at least 8 characters, letters and numbers.', 'warning');
                    return;
                }

                try {
                    btn.disabled = true;
                    btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';

                    const { error } = await supabase.auth.updateUser({ password: newPass });
                    if (error) throw error;

                    resetForm.classList.add('hidden');
                    resetHeader?.classList.add('hidden');
                    successBlock?.classList.remove('hidden');
                    try { await supabase.auth.signOut(); } catch (e) { console.warn(e); }
                }
                catch (err) {
                    console.error(err);
                    const type = classifyResetError(err);
                    const t = ERROR_TEXTS[lang] || ERROR_TEXTS.ru;
                    const key = type === 'same_password'
                        ? 'submit_same_password'
                        : type === 'expired'
                            ? 'submit_expired'
                            : type === 'network'
                                ? 'submit_network'
                                : 'submit_unknown';
                    showToast(t[key] || t.submit_unknown, 'error');
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            });
        }
        const requestNewBtn = document.getElementById('request-new-link-btn');
        if (requestNewBtn) {
            requestNewBtn.addEventListener('click', async () => {
                requestNewBtn.disabled = true;
                requestNewBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';

                try {
                    await supabase.auth.signOut();
                } catch (e) {
                    console.error(e);
                }

                localStorage.removeItem('valuon-remember-email');
                window.location.href = 'login.html?forgot=1';
            });
        }
    </script>
    <div id="toast-container" class="toast-container"></div>
    <script src="js/cookie-banner.js"></script>
    <script>  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    <script defer src="js/pwa.js"></script>
</body>

</html>
